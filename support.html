<style id="customerSupportFixedNav">

<style id="customerSupportModalFix">
/* Customer Support UI v0.15.4
   New Ticket form stays hidden until the top button is clicked. */
.modal{
  position:fixed;
  inset:0;
  z-index:2200;
  display:none;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:rgba(3,8,15,.76);
  backdrop-filter:blur(5px);
}
.modal.show{display:flex}
.modal-box{
  width:min(680px,100%);
  max-height:calc(100vh - 48px);
  overflow:auto;
  background:#172538;
  border:1px solid #3a4f6b;
  border-radius:18px;
  box-shadow:0 24px 80px rgba(0,0,0,.48);
  padding:22px;
}
.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  margin-bottom:18px;
  padding-bottom:14px;
  border-bottom:1px solid #31445e;
}
.modal-head h2{
  margin:0;
  font-size:24px;
  line-height:1.2;
}
.close-btn{
  width:38px;
  height:38px;
  border:1px solid #405570;
  border-radius:10px;
  background:#243952;
  color:#fff;
  font-size:22px;
  line-height:1;
  cursor:pointer;
}
.close-btn:hover{background:#314964}
.support-modal .cs-form{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.support-modal .cs-form textarea,
.support-modal .cs-form button{
  grid-column:1/-1;
}
.support-modal .cs-form input,
.support-modal .cs-form select,
.support-modal .cs-form textarea{
  min-height:46px;
  background:#101a28;
  border:1px solid #3a4e68;
  border-radius:10px;
  color:#fff;
  padding:12px 13px;
  font:inherit;
}
.support-modal .cs-form textarea{
  min-height:130px;
  resize:vertical;
}
.support-modal .cs-form button{
  min-height:48px;
  margin-top:2px;
}
.cs-top{
  padding:20px 22px;
  background:#172538;
  border:1px solid #31445e;
  border-radius:16px;
}
.cs-top h1{margin:0 0 7px;font-size:30px}
.cs-top p{margin:0;color:#aebcd0}
.cs-actions{flex-shrink:0}
@media(max-width:700px){
  .cs-top{align-items:flex-start;flex-direction:column}
  .cs-actions{width:100%}
  .cs-actions .cs-btn{flex:1}
  .support-modal .cs-form{grid-template-columns:1fr}
  .support-modal .cs-form textarea,
  .support-modal .cs-form button{grid-column:auto}
  .modal{padding:12px}
  .modal-box{max-height:calc(100vh - 24px);padding:17px}
}
</style>

<script id="dmReleaseBootstrap">
(() => {
  const RELEASE = 'v0.32.3';
  window.DESIMALL_RELEASE = RELEASE;
  try {
    const prev = localStorage.getItem('desimall_release');
    if (prev !== RELEASE) {
      localStorage.setItem('desimall_release', RELEASE);
      if ('caches' in window) {
        caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k)))).catch(() => {});
      }
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.update())).catch(() => {});
      }
    }
  } catch (_) {}
})();
</script>
