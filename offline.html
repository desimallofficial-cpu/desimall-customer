<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff6b00"><title>Offline - DesiMall</title><link rel="stylesheet" href="css/style.css?v=0.32.3"><style>body{min-height:100vh;display:grid;place-items:center;background:#fff7f1}.offline-card{max-width:520px;margin:20px;padding:36px;text-align:center;background:#fff;border-radius:22px;box-shadow:0 18px 50px rgba(0,0,0,.12)}.offline-icon{font-size:64px}.offline-card h1{margin:14px 0 8px}.offline-card p{color:#666;line-height:1.7}.offline-card button{margin-top:20px;border:0;background:#ff6b00;color:#fff;padding:13px 24px;border-radius:12px;font-weight:800;cursor:pointer}</style>  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="stylesheet" href="css/global-theme.css?v=0.32.3">

<script id="dmReleaseBootstrap">
(() => {
  const RELEASE = 'v0.32.3';
  window.DESIMALL_RELEASE = RELEASE;
  try {
    const prev = localStorage.getItem('desimall_release');
    if (prev !== RELEASE) {
      localStorage.setItem('desimall_release', RELEASE);
      if ('caches' in window) {
        caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k)))).catch(() => {});
      }
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.update())).catch(() => {});
      }
    }
  } catch (_) {}
})();
</script>

</head><body><main class="offline-card"><div class="offline-icon">📶</div><h1>You are offline</h1><p>DesiMall could not connect to the internet. Previously opened pages may still work. Reconnect and try again.</p><button onclick="location.reload()">Try Again</button></main>  <script src="js/ui-preferences.js?v=0.32.3"></script>
  <script src="js/analytics.js?v=0.32.3"></script>
</body></html>
